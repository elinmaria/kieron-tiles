# Copies the Google Sheet (projects, photos, About text, website copy, privacy and terms) into the site
# once a day, at about 6pm UK time. To update straight away: GitHub → Actions → "Update from the Google Sheet" → Run workflow.
name: Update from the Google Sheet
on:
  schedule:
    # GitHub's clock is UTC, so this fires at 17:02 and 18:02 UTC and the first step keeps only the one
    # that is 6pm or later in London (18:02 in winter, 17:02 = 18:02 BST in summer).
    - cron: '2 17,18 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-sheet
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only at 6pm London time
        id: when
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 18 ]; then
            echo "It's $hour:00 in London, waiting for the 6pm run"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.when.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.when.outputs.go == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.when.outputs.go == 'yes'
        run: pip install pillow==11.0.0
      - if: steps.when.outputs.go == 'yes'
        name: Copy the sheet and photos
        run: python3 scripts/sync_sheet.py
      - if: steps.when.outputs.go == 'yes'
        name: Save the changes
        run: |
          git add data img/sheet *.html js/config.js js/enquiry.js
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git config user.name "Victorian Tiler updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily update from the Google Sheet"
          git push
